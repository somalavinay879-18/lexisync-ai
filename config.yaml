# LexiSyncAI settings. All values are read by lexisync/pipeline.py.
seed: 42
cases_dir: data/cases

# Retrieval
embedding_model: BAAI/bge-small-en-v1.5
reranker_model: cross-encoder/ms-marco-MiniLM-L-6-v2
rerank_candidates: 30   # passages from BM25 + dense that the cross-encoder rescores
top_k: 6                # passages given to the LLM

# Grounding and abstention
abstain_threshold: 0.1  # best reranker relevance below this -> abstain without calling the LLM
max_verify_attempts: 2  # generate -> verify -> (reformulate, retrieve, regenerate) at most twice

# LLM (override with environment variables LLM_BACKEND, LLM_MODEL, OLLAMA_HOST)
llm_model: qwen2.5:7b
