name: CI
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: sudo apt-get install -y tesseract-ocr
      - run: pip install pymupdf==2.1 rank-bm25==0.2.2 numpy==2.5.3 requests==2.34.2 pyyaml==6.0.3 rapidfuzz==3.14.6 pytesseract==0.3.13 pillow==12.3.0 pytest==9.1.1
      - run: pytest -q
